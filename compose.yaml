services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      WRANGLER_LOG_PATH: /tmp/wrangler.log
      CI: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  node_modules:
  pnpm_store:
